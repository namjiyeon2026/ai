<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Assistant - Powered by Copilot Studio">
    <title>AI Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #f5f7fa;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px 24px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .header-text h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }

      .header-text p {
        font-size: 12px;
        opacity: 0.9;
        margin: 4px 0 0 0;
      }

      .content {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      .iframe-wrapper {
        width: 100%;
        height: 100%;
        border-radius: 12px 12px 0 0;
        overflow: hidden;
        box-shadow: inset 0 -4px 12px rgba(0, 0, 0, 0.05);
        position: relative;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      .iframe-fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(245,247,250,0.95);
        text-align: center;
        gap: 12px;
        flex-direction: column;
      }

      .iframe-fallback p { color: #333; }
      .iframe-fallback a { color: #3b82f6; text-decoration: underline; }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .header-text h1 {
          font-size: 18px;
        }

        .header-icon {
          width: 28px;
          height: 28px;
          font-size: 16px;
        }
      }

      /* 로딩 상태 애니메이션 */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container {
        animation: fadeIn 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-icon">🤖</div>
        <div class="header-text">
          <h1>AI Assistant</h1>
          <p>Powered by Copilot Studio</p>
        </div>
      </header>
      
      <main class="content">
        <div class="iframe-wrapper">
          <!--
            IMPORTANT: Replace the placeholder below with the full Copilot Studio bot URL.
            Example: https://copilotstudio.microsoft.com/environments/<env-id>/bots/<bot-id>?share=public
          -->
          <iframe id="botFrame"
                  src=""
                  title="AI Chat Bot"
                  allow="microphone; camera; autoplay;"
                  sandbox="allow-scripts allow-forms allow-same-origin allow-popups">
          </iframe>

          <div id="iframeFallback" class="iframe-fallback" style="display:none;">
            <p style="font-weight:600;">봇을 불러올 수 없습니다.</p>
            <p>임베드가 차단되었거나 올바르지 않은 URL 때문에 로드되지 않습니다. 아래 버튼으로 새 탭에서 열어보세요.</p>
            <div>
              <a id="botLink" href="#" target="_blank" rel="noopener noreferrer">Open AI Chat Bot in a new tab</a>
            </div>
            <p style="color:#666; font-size:13px;">(브라우저 콘솔의 에러: X-Frame-Options, CSP 또는 인증 문제일 수 있습니다.)</p>
          </div>
        </div>
      </main>
    </div>

    <script>
      // Put the full Copilot Studio bot URL here.
      // Replace the placeholder string below with the complete URL you get from Copilot Studio (don't leave the "[...]" part).
      const botUrl = "https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/PUT_YOUR_FULL_BOT_PATH_HERE";

      const iframe = document.getElementById('botFrame');
      const fallback = document.getElementById('iframeFallback');
      const botLink = document.getElementById('botLink');

      botLink.href = botUrl;

      // Attempt to set src programmatically so the placeholder is obvious in the file.
      // If botUrl still contains 'PUT_YOUR_FULL_BOT_PATH_HERE' the iframe won't be loaded; update the URL.
      if (botUrl && !botUrl.includes('PUT_YOUR_FULL_BOT_PATH_HERE')) {
        iframe.src = botUrl;
      } else {
        console.warn('Bot URL is a placeholder. Please replace botUrl in index.html with the full Copilot Studio embed URL.');
        // show fallback immediately if placeholder remains
        fallback.style.display = 'block';
      }

      // onload may still fire even when the content is an error page; use a timeout to detect likely blocking.
      let loaded = false;
      iframe.addEventListener('load', () => {
        loaded = true;
        // If the frame loaded something but later we can't communicate due to cross-origin or blocked frame,
        // user should still be able to interact if Copilot Studio allows embedding.
        fallback.style.display = 'none';
      });

      // If load doesn't happen within 6s, show fallback. This covers X-Frame-Options/CSP blocking where onload may not fire.
      setTimeout(() => {
        if (!loaded) {
          fallback.style.display = 'block';
          console.info('Iframe did not finish loading within timeout — showing fallback link. Check browser console for X-Frame-Options/CSP or network errors.');
        }
      }, 6000);
    </script>
  </body>
</html>
