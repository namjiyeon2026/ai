<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Assistant - Powered by Copilot Studio">
    <title>AI Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #f5f7fa;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px 24px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      .header-text h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }

      .header-text p {
        font-size: 12px;
        opacity: 0.9;
        margin: 4px 0 0 0;
      }

      .content {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      .iframe-wrapper {
        width: 100%;
        height: 100%;
        border-radius: 12px 12px 0 0;
        overflow: hidden;
        box-shadow: inset 0 -4px 12px rgba(0, 0, 0, 0.05);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
        }

        .header-text h1 {
          font-size: 18px;
        }

        .header-icon {
          width: 28px;
          height: 28px;
          font-size: 16px;
        }
      }

      /* 로딩 상태 애니메이션 */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container {
        animation: fadeIn 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-icon">🤖</div>
        <div class="header-text">
          <h1>AI Assistant</h1>
          <p>Powered by Copilot Studio</p>
        </div>
      </header>
      
      <main class="content">
        <div class="iframe-wrapper">
          <iframe 
            src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/cr470_aimulti_[...]"
            title="AI Chat Bot"
            allow="microphone; camera">
          </iframe>
        </div>
      </main>
    </div>
  </body>
</html>
